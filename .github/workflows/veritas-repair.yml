name: VERITAS independent repair tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    name: veritas-repair-ci
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ startsWith(github.head_ref, 'auto/repair-') && github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - name: Build fixed test environment
        run: docker build -t veritas-ci trusted/.github/repair
      - name: Run tests without credentials or network
        env:
          AUTOREPAIR: ${{ startsWith(github.head_ref, 'auto/repair-') }}
        run: >-
          timeout 300 docker run --rm --network none --read-only
          --cap-drop ALL --security-opt no-new-privileges
          --memory 2g --cpus 2 --pids-limit 128 --tmpfs /tmp:rw,noexec,nosuid,size=64m
          -e AUTOREPAIR="$AUTOREPAIR"
          -v "$GITHUB_WORKSPACE/candidate:/candidate:ro"
          -v "$GITHUB_WORKSPACE/trusted:/trusted:ro"
          veritas-ci python -I /trusted/.github/repair/verify.py
